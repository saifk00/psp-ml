[package]
name = "birdnet-frontend-benchmark"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "birdnet-frontend-benchmark"
path = "src/main.rs"

[features]
# `local` by default so `cargo test`/`cargo build` treat this as a normal host
# crate (scalar kernels, both frontends compiled in, mode picked by --mode).
# The device build passes --no-default-features --features mode-* to get a
# no_std PRX containing exactly ONE frontend, so its arena and blob attribute
# cleanly to the mode being measured.
default = ["local"]
local = []
mode-dense = []
mode-custom = []
mode-small = []

[dependencies]
psp-rt = { path = "../../../toolchain/psp-rt" }

[target.'cfg(target_os = "psp")'.dependencies]
psp = "0.3"

[build-dependencies]
psp-tc = { path = "../../../toolchain/psp-tc" }
serde_json = "1"
