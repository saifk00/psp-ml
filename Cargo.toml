[workspace]
resolver = "2"
members = [
    "toolchain/psp-rt",
    "toolchain/psp-tc",
    "toolchain/psp-tc/vme-assembler",
    "toolchain/usbhostfs-sys",
    "toolchain/vme-emu-sys",
    "toolchain/psplink-connection",
    "toolchain/device-tests",
    "apps/pspbird/device",
    "apps/pspbird/host",
    "apps/pspbird/bench-host",
    "apps/pspbird/install/device",
    "apps/pspbird/install/host",
    "apps/pspbird/imview/device",
    "apps/pspbird/imview/host",
    "examples/audio-recorder",
    "examples/mnist-bench/device",
    "examples/mnist-bench/host",
    "examples/hello-psp/device",
    "examples/hello-psp/host",
    "examples/meminfo/device",
    "examples/meminfo/host",
    "examples/profiler-demo/device",
    "examples/profiler-demo/host",
    "examples/roofline/device",
    "examples/roofline/host",
    "examples/fc-bench/device",
    "examples/fc-bench/host",
    "examples/fft-demo/device",
    "examples/fft-demo/host",
    "examples/profiler-install/device",
    "examples/profiler-install/host",
    "examples/gemv-bench/device",
    "examples/gemv-bench/host",
    "examples/vme-mac-rs/device",
    "examples/vme-mac-rs/host",
    "examples/vme-conformance/device",
    "examples/vme-conformance/host",
    "examples/vme-install/device",
    "examples/vme-install/host",
    "examples/vme-conv-bench/device",
    "examples/vme-conv-bench/host",
    "examples/birdnet-stft-benchmark/device",
    "examples/birdnet-stft-benchmark/host",
    "examples/birdnet-mel-benchmark/device",
    "examples/birdnet-mel-benchmark/host",
    "examples/birdnet-frontend-benchmark/device",
    "examples/birdnet-frontend-benchmark/host",
]
# What a bare `cargo test` / `cargo build` covers: everything that needs no
# hardware and no gitignored assets. birdnet is excluded only because its
# device build.rs needs `models/birdnet/*.tflite`, which is not in the repo.
default-members = [
    "toolchain/psp-rt",
    "toolchain/psp-tc",
    "toolchain/psp-tc/vme-assembler",
    "toolchain/psplink-connection",
    "examples/mnist-bench/device",
    "examples/mnist-bench/host",
]
