[package]
name = "psp-tc"
version = "0.1.0"
edition = "2021"
description = "TFLite -> Rust AOT compiler targeting the psp-rt runtime."

[lib]
name = "psp_tc"
path = "src/lib.rs"

[[bin]]
name = "psp-tc"
path = "src/bin/psp-tc.rs"

[[bin]]
name = "vme-dump"
path = "src/bin/vme-dump.rs"

[dependencies]
# psp-rt supplies the packed-B layout used by `gemm_bt_packed`, so the
# compile-time packer here cannot drift from the runtime kernel.
psp-rt = { path = "../../toolchain/psp-rt" }
# vme-dump reads the machine-image format this crate's vme-assembler defines.
vme-assembler = { path = "vme-assembler" }
flatbuffers = "24.3"
quote = "1"
proc-macro2 = "1"
syn = "2"
prettyplease = "0.2"
serde_json = "1"
