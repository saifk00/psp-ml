[package]
name = "birdnet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "birdnet"
path = "src/main.rs"

# The interactive app (design/2026-08-24_pspbird-app.md), built by
# `cargo run -p pspbird-host`. Its model pipeline is the `psp_bird` module
# of this crate's library.
[[bin]]
name = "pspbird"
path = "src/bin/pspbird.rs"
required-features = ["app"]

[lib]
name = "birdnet"
path = "src/lib.rs"

[features]
hwprofile = []
# `local` by default so `cargo test`/`cargo build` treat this as a normal host
# crate (scalar kernels, same generated code). `cargo psp` passes
# --no-default-features to get the real no_std device build; forgetting that
# fails loudly at link time rather than silently building the wrong thing.
default = ["local"]
local = []
# Replace the model's dense spectrogram frontend with the custom-op one
# (StridedViewStft + FullyConnectedCB + SquarePow): build.rs severs the
# .tflite at the branch-merge CONCAT and compiles only the conv backbone
# from it, plus a builder-generated frontend module; main.rs runs the two
# forwards in sequence. Enable via BIRDNET_CUSTOM_FRONTEND=1 on the host
# runner, which forwards it as this feature.
custom-frontend = []
# The pspbird app build: headless backbone (custom frontend, small FFT) plus
# runtime-loaded classifier blobs, one per pruner region. Device-only.
app = ["imfile"]
# The species-image pack reader (`birdnet::imfile`, no_std): what the
# pspbird-imview example and, later, the app's image mode link against.
# On its own it skips the model compile in build.rs.
imfile = []
# ...plus the host-side packer (`imfile::pack_images`): JPEG/PNG decode,
# manifest.toml parsing. std only.
imfile-pack = ["imfile", "dep:image", "dep:toml"]

[dependencies]
psp-rt = { path = "../../../toolchain/psp-rt" }
libm = "0.2"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"], optional = true }
toml = { version = "0.8", optional = true }

[target.'cfg(target_os = "psp")'.dependencies]
psp = "0.3"

[build-dependencies]
psp-tc = { path = "../../../toolchain/psp-tc" }
serde_json = "1"
