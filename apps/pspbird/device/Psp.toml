# XMB presentation for the EBOOTs cargo-psp packs from this crate. Art is
# generated by ../make_icon.py (vector, no photo, so no licence to carry).
title = "PSPBird"
# NO disc_version here: cargo-psp passes it as `mksfo -s DISC_VERSION=...`,
# but the SDK's mksfo takes no flags (usage: `mksfo TITLE output.sfo`) — it
# treats "-s" as the title, writes the SFO to a junk file named
# "DISC_VERSION=0.01" in this directory, and exits 0, so the EBOOT silently
# keeps a stale PARAM.SFO. The release version lives in the zip name and
# README instead.
xmb_icon_png = "icon0.png"
xmb_background_png = "pic1.png"
